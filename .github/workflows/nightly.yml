name: "Nightly Build"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *' # Optional: Runs every night at midnight UTC

jobs:
  nightly-release:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set current date
        id: date
        # We store the date in the GITHUB_OUTPUT buffer
        run: echo "now=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cascadia Code Font
        run: |
          mkdir -p install
          pushd ./install

          wget -q https://github.com/microsoft/cascadia-code/releases/download/v2407.24/CascadiaCode-2407.24.zip
          unzip CascadiaCode-2407.24.zip
          sudo mv ./ttf/*.ttf /usr/share/fonts/
          sudo mv ./ttf/static/*.ttf /usr/share/fonts/
          fc-cache -fv

          popd

      - name: Install LXGW WenKai Font
        run: |
          mkdir -p install
          pushd ./install

          wget -q https://github.com/lxgw/LxgwWenKai/releases/download/v1.522/lxgw-wenkai-v1.522.zip
          unzip lxgw-wenkai-v1.522.zip
          sudo mv lxgw-wenkai-v1.522/*.ttf /usr/share/fonts
          fc-cache -fv

          popd

      - name: Build Handbooks
        env:
          R2_BUCKET: picbed
          R2_BACKEND: s3
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          nix develop --command bash .scripts/check-pictures.sh
          nix run .#handbook

      - name: Create Nightly Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (Latest)"
          body: |
            ### Notes of AshGrey Nightly Build
            Release created at ${{ steps.date.outputs.now }}
            Release commit at ${{ github.sha }}

          prerelease: false
          # This grabs every PDF in your build folder
          files: build/*.pdf
          # Overwrites the existing 'nightly' tag assets
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
